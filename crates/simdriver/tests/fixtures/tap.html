<!doctype html><meta name=viewport content="width=device-width"><style>
html,body{margin:0;height:100%;background:#000;touch-action:none}
/* The bar identifies the page: Safari's black loading/error canvas has none,
   so "black centre" alone can never prove tap.html loaded. 40px stays clear of
   the status-bar clock and below it the IT scans rows 100–350. */
#bar{position:fixed;top:40px;left:0;right:0;height:6px;background:#fff}
</style><div id=bar></div><script>
const bg=c=>document.documentElement.style.background=document.body.style.background=c;
addEventListener('touchstart',()=>bg('#fff'),{passive:true});
addEventListener('touchend',()=>bg('#000'),{passive:true});
addEventListener('touchcancel',()=>bg('#000'),{passive:true});
</script>
