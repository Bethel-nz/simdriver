[package]
name = "simdriver-agent"
description = "Agent layer over simdriver: element refs, annotated screenshots, validated taps, multi-step flows"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["ios", "simulator", "automation", "agents"]
categories = ["development-tools::testing"]

[dependencies]
simdriver = { path = "../simdriver", version = "0.2.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
