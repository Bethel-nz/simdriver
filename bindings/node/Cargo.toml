[package]
# The npm package is `simdriver` (package.json); the *crate* name must differ because
# the workspace already has crates/simdriver. napi build emits simdriver.<platform>.node.
name = "simdriver-node"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
serde_json = "1"
simdriver-core = { path = "../../crates/simdriver", package = "simdriver" }
simdriver-agent = { path = "../../crates/simdriver-agent" }

[build-dependencies]
# napi-build stays on 2.x on crates.io; it only emits cargo:rerun directives.
napi-build = "2"
