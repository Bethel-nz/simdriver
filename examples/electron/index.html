<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>simdriver</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #aaa; font: 12px -apple-system, sans-serif; }
      body { display: flex; flex-direction: column; }
      #box { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
      /* The canvas keeps the frame's aspect and is what input is measured against. */
      canvas { max-width: 100%; max-height: 100%; touch-action: none; outline: none; }
      #bar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; }
      #state { flex: 1; }
      button { font: inherit; }
    </style>
  </head>
  <body>
    <div id="box"><canvas id="screen" tabindex="0"></canvas></div>
    <div id="bar">
      <span id="state">starting…</span>
      <button id="home" title="Home">Home</button>
      <button id="lock" title="Lock">Lock</button>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
